[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akshat-causal-toolkit"
version = "0.1.0"
description = "A Python package for causal inference methods including ATE estimation, propensity score methods, and meta-learners"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Akshat Gupta"}
]
keywords = [
    "causal inference",
    "statistics",
    "machine learning",
    "treatment effects",
    "meta learners"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "mypy>=0.950"
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/akshat-causal-toolkit"
Documentation = "https://github.com/YOUR_GITHUB_USERNAME/akshat-causal-toolkit#readme"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/akshat-causal-toolkit"
"Bug Tracker" = "https://github.com/YOUR_GITHUB_USERNAME/akshat-causal-toolkit/issues"

[tool.setuptools.packages.find]
include = ["akshat_causal_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"